name: Build macOS

on:
  push:
    branches: ["main", "fix/perf-leaks"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install protoc
        run: brew install protobuf

      - name: Install protoc-gen-go + protoc-gen-connect-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

      - name: Install Task
        run: brew install go-task

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Generate proto
        run: task common:generate:proto

      - name: Build macOS arm64 DMG
        run: task build:darwin:arm64

      - name: Build macOS arm64 release archive
        run: task release:build:macos:arm64

      - name: Build macOS amd64 release archive
        run: task release:build:macos:amd64

      - name: Build Windows amd64 release archive
        run: task release:build:windows:amd64

      - name: Extract version
        id: version
        run: |
          VERSION=$(yq '.info.version' build/config.yml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: go run ./scripts/release notes -config ./build/config.yml -out bin/release/${{ steps.version.outputs.version }}/.release-notes.md -source release-notes.md

      - name: Generate update manifest
        run: |
          set -e
          ASSETS_DIR="bin/release/${{ steps.version.outputs.version }}"
          REPO="Cao-Junqi/cursor-byok"
          VER="${{ steps.version.outputs.version }}"
          TMPFILE=$(mktemp)
          echo '{' > "$TMPFILE"
          echo "  \"version\": \"${VER}\"," >> "$TMPFILE"
          echo "  \"release_date\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$TMPFILE"
          echo '  "release_notes": "See GitHub Release for details",' >> "$TMPFILE"
          echo '  "platforms": {' >> "$TMPFILE"
          FIRST=true
          for PLATFORM in macos-arm64 macos-amd64 windows-amd64; do
            if [[ "$PLATFORM" == macos-* ]]; then
              ASSET="$ASSETS_DIR/cursor-byok-${VER}-${PLATFORM}.tar.gz"
              SUF=".tar.gz"
            else
              ASSET="$ASSETS_DIR/cursor-byok-${VER}-${PLATFORM}.zip"
              SUF=".zip"
            fi
            if [ ! -f "$ASSET" ]; then
              echo "Warning: $ASSET not found, skipping $PLATFORM" >&2
              continue
            fi
            CS=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)
            SZ=$(stat -f%z "$ASSET")
            URL="https://github.com/${REPO}/releases/download/v${VER}/cursor-byok-${VER}-${PLATFORM}${SUF}"
            if [ "$FIRST" = false ]; then echo ',' >> "$TMPFILE"; fi
            echo "    \"${PLATFORM}\": {" >> "$TMPFILE"
            echo "      \"url\": \"${URL}\"," >> "$TMPFILE"
            echo "      \"size\": ${SZ}," >> "$TMPFILE"
            echo "      \"checksum\": \"sha256:${CS}\"" >> "$TMPFILE"
            echo -n '    }' >> "$TMPFILE"
            FIRST=false
          done
          echo '' >> "$TMPFILE"
          echo '  }' >> "$TMPFILE"
          echo '}' >> "$TMPFILE"
          jq . "$TMPFILE"
          cp "$TMPFILE" update.json
          rm -f "$TMPFILE"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-byok-macos-arm64
          path: bin/macos-arm64.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: bin/release/${{ steps.version.outputs.version }}/.release-notes.md
          files: |
            bin/release/${{ steps.version.outputs.version }}/*.tar.gz
            bin/release/${{ steps.version.outputs.version }}/*.zip
            update.json
